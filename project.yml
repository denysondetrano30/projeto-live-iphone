# Projeto do app de iPhone, no formato do XcodeGen.
# O GitHub gera o projeto do Xcode a partir deste arquivo na hora de montar o app.
name: ProjetoLive
options:
  bundleIdPrefix: com.denysondetrano30
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "9"
packages:
  # libsrt (licença MPL 2.0) empacotada para iPhone pelo projeto HaishinKit. O app comprime e
  # empacota o vídeo ele mesmo e usa só o SRT dela (veja App/SRTSender.swift).
  libsrt:
    url: https://github.com/HaishinKit/libsrt-xcframework.git
    exactVersion: 1.5.7
targets:
  ProjetoLive:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: libsrt
        product: libsrt
    settings:
      base:
        PRODUCT_NAME: ProjetoLive
        PRODUCT_BUNDLE_IDENTIFIER: com.denysondetrano30.projetolive.camera
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Projeto Live
        NSCameraUsageDescription: O Projeto Live usa a câmera para mandar a imagem para o computador da transmissão e para ler o QR code de pareamento.
        NSLocalNetworkUsageDescription: O Projeto Live usa a rede local para mandar a imagem da câmera para o OBS no computador da transmissão.
        NSMicrophoneUsageDescription: O Projeto Live usa o microfone só no intercom, enquanto você segura "Segure para falar", para conversar com o diretor. Esse som não vai para a transmissão.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # Só deitado: a transmissão é 16:9 e o vertical é recortado no PC.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  ProjetoLive:
    build:
      targets:
        ProjetoLive: all
