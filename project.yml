# Projeto do app de iPhone, no formato do XcodeGen.
# O GitHub gera o projeto do Xcode a partir deste arquivo na hora de montar o app.
name: ProjetoLive
options:
  bundleIdPrefix: com.denysondetrano30
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "6"
packages:
  # Biblioteca de transmissão (licença BSD-3). O SRT usa a libsrt (licença MPL 2.0).
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.3.0
targets:
  ProjetoLive:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
    settings:
      base:
        PRODUCT_NAME: ProjetoLive
        PRODUCT_BUNDLE_IDENTIFIER: com.denysondetrano30.projetolive.camera
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Projeto Live
        NSCameraUsageDescription: O Projeto Live usa a câmera para mandar a imagem para o computador da transmissão e para ler o QR code de pareamento.
        NSLocalNetworkUsageDescription: O Projeto Live usa a rede local para mandar a imagem da câmera para o OBS no computador da transmissão.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # Só deitado: a transmissão é 16:9 e o vertical é recortado no PC.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  ProjetoLive:
    build:
      targets:
        ProjetoLive: all
