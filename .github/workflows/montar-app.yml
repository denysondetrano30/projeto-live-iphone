name: Montar app iPhone
run-name: Montar app iPhone (${{ github.sha }})
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
jobs:
  montar:
    name: Montar o .ipa
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Instalar ferramentas
        run: |
          brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify
          xcodebuild -version

      - name: Gerar o projeto do Xcode
        run: xcodegen generate

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild \
            -project ProjetoLive.xcodeproj \
            -scheme ProjetoLive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify --renderer github-actions

      - name: Empacotar o .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ProjetoLive.app Payload/
          zip -qry ProjetoLive.ipa Payload
          ls -lh ProjetoLive.ipa

      - name: Guardar o .ipa para download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ProjetoLive-ipa-${{ github.run_number }}
          path: ProjetoLive.ipa
          retention-days: 30

      # Publica também em Releases > "teste", que baixa sem login, sempre no mesmo link:
      # https://github.com/denysondetrano30/projeto-live-iphone/releases/download/teste/ProjetoLive.ipa
      - name: Publica em Releases > teste (baixa sem login)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="App de camera do iPhone de teste (compilacao ${{ github.run_number }}). Instale com o Sideloadly (Windows ou Mac)."
          if ! gh release view teste >/dev/null 2>&1; then
            gh release create teste --prerelease --target main --title "Versao de teste" --notes "$notes"
          else
            gh release edit teste --notes "$notes"
          fi
          gh release upload teste ProjetoLive.ipa --clobber
